const list=document.querySelector("#list"),frame=document.querySelector("#frame"),title=document.querySelector("#title"),status=document.querySelector("#status"),empty=document.querySelector("#empty"),search=document.querySelector("#search");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]||c))}
function fileFor(g){return CDN+"htmlGames/"+encodeURIComponent(g.path).replace(/%2F/g,"_")+".html"}
function render(q=""){list.innerHTML="";const a=games.filter(g=>g.name.toLowerCase().includes(q.toLowerCase()));for(const g of a){const b=document.createElement("button");b.className="game";b.textContent=g.name;b.onclick=()=>openZone(g);list.appendChild(b)}status.textContent=a.length+" zones"}
function openZone(g){frame.src=fileFor(g);title.textContent=g.name;empty.style.display="none";document.title="Holost / "+g.name;history.replaceState({zone:g.path},"","?zone="+encodeURIComponent(g.path));[...list.children].forEach(b=>b.classList.toggle("active",b.textContent===g.name))}
search.oninput=e=>render(e.target.value);
window.addEventListener("popstate",()=>loadFromUrl());
function loadFromUrl(){const id=new URLSearchParams(location.search).get("zone");if(id){const g=games.find(x=>x.path===id);if(g)openZone(g)}}
render();loadFromUrl();
</script>
