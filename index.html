<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOHO GAMES + GN-MATH</title>
    <meta name="title" content="HOHO GAMES + GN-MATH">
    <meta name="description" content="HOHO GAMES + GN-MATH — fast unblocked games. Play instantly, no downloads.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="HOHO GAMES + GN-MATH">
    <meta property="og:description" content="HOHO GAMES + GN-MATH — fast unblocked games. Play instantly, no downloads.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23000'/><text x='32' y='44' text-anchor='middle' font-size='32' font-family='sans-serif' fill='%23fff'>H</text></svg>">
    <style>
:root {
    --bg: #050505;
    --bg-2: #0c0c0c;
    --bg-3: #141414;
    --surface: #111;
    --text: #f5f5f5;
    --muted: #9a9a9a;
    --faint: #6a6a6a;
    --line: #222;
    --line-2: #2c2c2c;
    --card: #101010;
    --hover: #1a1a1a;
    --white: #ffffff;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    --radius: 10px;
    --gap: 8px;
    --header-h: 72px;
}

body.light {
    --bg: #f4f4f4;
    --bg-2: #ffffff;
    --bg-3: #ececec;
    --surface: #ffffff;
    --text: #111111;
    --muted: #555555;
    --faint: #888888;
    --line: #e4e4e4;
    --line-2: #d4d4d4;
    --card: #ffffff;
    --hover: #f0f0f0;
    --white: #000000;
    --shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font-family: inherit; color: inherit; }

a { color: var(--text); }

/* ===== LOADING SCREEN ===== */
#boot {
    position: fixed;
    inset: 0;
    z-index: 4000;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 0.55s ease, visibility 0.55s ease;
}
#boot.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
.boot-mark {
    font-size: 13px;
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: #fff;
    font-weight: 700;
    animation: pulse 1.4s ease-in-out infinite;
}
.boot-title {
    font-size: clamp(28px, 6vw, 56px);
    font-weight: 800;
    letter-spacing: -0.05em;
    color: #fff;
}
.boot-title span { opacity: 0.4; font-weight: 500; font-size: 0.45em; letter-spacing: 0.18em; display: block; margin-top: 8px; }
.boot-bar {
    width: min(280px, 70vw);
    height: 2px;
    background: #222;
    overflow: hidden;
    border-radius: 2px;
}
.boot-bar i {
    display: block;
    height: 100%;
    width: 40%;
    background: #fff;
    animation: bootSlide 1.1s ease-in-out infinite;
}
@keyframes bootSlide {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(350%); }
}
@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
}

/* ===== HEADER ===== */
header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(18px) saturate(140%);
    border-bottom: 1px solid var(--line);
}
.header-inner {
    max-width: 1440px;
    margin: 0 auto;
    min-height: var(--header-h);
    padding: 12px 20px;
    display: grid;
    grid-template-columns: 1fr minmax(220px, 520px) 1fr;
    align-items: center;
    gap: 16px;
}
.brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
    text-decoration: none;
    color: var(--text);
    white-space: nowrap;
}
.brand b {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.05em;
}
.brand em {
    font-style: normal;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--faint);
    font-weight: 600;
}
.search-wrap {
    position: relative;
    width: 100%;
}
.search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    opacity: 0.45;
    pointer-events: none;
}
#searchBar {
    width: 100%;
    height: 44px;
    padding: 0 14px 0 40px;
    border: 1px solid var(--line-2);
    border-radius: 999px;
    background: var(--bg-2);
    outline: none;
    font-size: 14px;
    transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
}
#searchBar:focus {
    border-color: var(--white);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--white) 18%, transparent);
    transform: translateY(-1px);
}
.header-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
}
#sortOptions, .icon-btn {
    height: 40px;
    border: 1px solid var(--line-2);
    background: var(--bg-2);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s, border-color 0.2s;
}
#sortOptions {
    padding: 0 14px;
    font-size: 13px;
    color: var(--muted);
    min-width: 120px;
}
.icon-btn {
    width: 40px;
    padding: 0;
    display: grid;
    place-items: center;
    font-size: 16px;
}
#sortOptions:hover, .icon-btn:hover {
    background: var(--hover);
    border-color: var(--white);
    transform: translateY(-1px);
}

/* ===== LAYOUT ===== */
main {
    max-width: 1440px;
    margin: 0 auto;
    padding: 22px 20px 120px;
}
.section-head {
    display: flex;
    align-items: end;
    justify-content: space-between;
    margin: 8px 0 12px;
}
.section-head h2 {
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-weight: 700;
}
.section-head p { color: var(--muted); font-size: 12px; }

/* ===== CAROUSEL ===== */
.carousel-shell {
    position: relative;
    margin-bottom: 28px;
    overflow: hidden;
    mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
}
.carousel-track {
    display: flex;
    gap: var(--gap);
    width: max-content;
    animation: reel 22s linear infinite;
    will-change: transform;
}
.carousel-shell:hover .carousel-track,
.carousel-shell.pause .carousel-track {
    animation-play-state: paused;
}
.carousel-track .zone-item {
    flex: 0 0 calc((100vw - 40px - 7 * var(--gap)) / 8);
    max-width: 180px;
    min-width: 140px;
}
@keyframes reel {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}

/* ===== GRID ===== */
#container {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: var(--gap);
}
.zone-item {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s, box-shadow 0.28s;
    animation: rise 0.5s ease both;
}
.zone-item:hover {
    transform: translateY(-5px);
    border-color: var(--white);
    box-shadow: var(--shadow);
    z-index: 2;
}
.zone-item img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: var(--bg-3);
    transition: transform 0.45s ease, filter 0.3s;
}
.zone-item:hover img { transform: scale(1.07); }
.zone-item button, .zone-item .zone-label {
    background: transparent;
    border: 0;
    color: var(--text);
    padding: 10px 8px;
    font-weight: 650;
    font-size: 12px;
    text-align: center;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1.25;
}
@keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

/* wavy skeletons */
.skel {
    pointer-events: none;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--card);
    min-height: 190px;
}
.skel i {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    background: linear-gradient(110deg, var(--bg-3) 8%, var(--hover) 18%, var(--bg-3) 33%);
    background-size: 200% 100%;
    animation: wave 1.15s linear infinite;
}
.skel b {
    display: block;
    height: 10px;
    margin: 16px 18px;
    border-radius: 99px;
    background: var(--bg-3);
    animation: wave 1.15s linear infinite;
}
@keyframes wave {
    to { background-position-x: -200%; }
}

#zoneCount {
    margin: 18px 0 10px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.08em;
}

/* ===== VIEWER ===== */
#zoneViewer {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 1000;
    display: none;
    flex-direction: column;
    animation: up 0.32s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes up {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: none; opacity: 1; }
}
.zone-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-2);
}
#zoneName { font-size: 16px; font-weight: 800; letter-spacing: -0.03em; }
#zoneAuthor { color: var(--muted); font-size: 12px; text-decoration: none; }
#zoneAuthor:hover { color: var(--text); }
.zone-controls { display: flex; gap: 6px; flex-wrap: wrap; }
.zone-controls button, .btn {
    background: var(--text);
    color: var(--bg);
    border: 0;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    transition: transform 0.15s, opacity 0.15s;
}
.zone-controls button:nth-child(n+2), .btn.ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line-2);
}
.zone-controls button:hover, .btn:hover { transform: translateY(-1px); opacity: 0.9; }
#zoneFrame { flex: 1; width: 100%; border: 0; background: #000; }

/* ===== POPUP ===== */
#popupOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.62);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    padding: 16px;
}
.popup {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    width: 100%;
    max-width: 520px;
    max-height: 82vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    animation: pop 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes pop {
    from { transform: scale(0.96) translateY(10px); opacity: 0; }
    to { transform: none; opacity: 1; }
}
.popup-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
}
#popupTitle { font-size: 16px; font-weight: 800; }
#popupClose {
    width: 32px; height: 32px;
    border: 0; background: var(--bg-3); color: var(--text);
    border-radius: 8px; cursor: pointer;
}
#popupBody { padding: 18px; overflow: auto; font-size: 14px; color: var(--muted); }
#popupBody h3 { color: var(--text); margin: 14px 0 8px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
#popupBody label { display: block; color: var(--text); font-size: 12px; font-weight: 700; margin-bottom: 6px; }
#popupBody input[type="text"], #popupBody input[type="url"], #popupBody textarea, #popupBody select {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 12px;
    border: 1px solid var(--line-2);
    border-radius: 10px;
    background: var(--bg-2);
    outline: none;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.switch {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--line); color: var(--text);
}
.btn-block {
    width: 100%;
    margin-bottom: 8px;
}

/* ===== CHAT ===== */
#chatFab {
    position: fixed;
    right: 18px;
    bottom: 72px;
    z-index: 300;
    width: 52px; height: 52px;
    border-radius: 16px;
    border: 1px solid var(--line-2);
    background: var(--text);
    color: var(--bg);
    cursor: pointer;
    font-weight: 800;
    box-shadow: var(--shadow);
    transition: transform 0.2s;
}
#chatFab:hover { transform: translateY(-3px) scale(1.04); }
#chatPanel {
    position: fixed;
    right: 18px;
    bottom: 132px;
    width: min(340px, calc(100vw - 24px));
    height: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    z-index: 301;
    display: none;
    flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: pop 0.25s ease;
}
#chatPanel.open { display: flex; }
.chat-top {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 800;
    font-size: 13px;
}
#chatLog {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.msg {
    background: var(--bg-3);
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 13px;
    animation: rise 0.25s ease;
}
.msg b { display: block; font-size: 11px; color: var(--faint); margin-bottom: 2px; }
.chat-form {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid var(--line);
}
.chat-form input {
    flex: 1;
    border: 1px solid var(--line-2);
    background: var(--bg-2);
    border-radius: 10px;
    padding: 10px;
    outline: none;
}
.chat-form button {
    border: 0;
    background: var(--text);
    color: var(--bg);
    border-radius: 10px;
    padding: 0 12px;
    font-weight: 800;
    cursor: pointer;
}

footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 100;
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    padding: 10px 16px;
    text-align: center;
}
.footer-links { display: flex; justify-content: center; gap: 6px 14px; flex-wrap: wrap; }
.footer-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 6px;
}
.footer-links a:hover { color: var(--text); }

@media (max-width: 1200px) {
    #container { grid-template-columns: repeat(6, 1fr); }
    .carousel-track .zone-item { flex-basis: calc((100vw - 40px - 5 * var(--gap)) / 6); }
}
@media (max-width: 860px) {
    .header-inner {
        grid-template-columns: 1fr auto;
        grid-template-areas: "brand actions" "search search";
    }
    .brand { grid-area: brand; }
    .search-wrap { grid-area: search; }
    .header-actions { grid-area: actions; }
    #container { grid-template-columns: repeat(4, 1fr); }
    .carousel-track .zone-item { flex-basis: calc((100vw - 40px - 3 * var(--gap)) / 4); }
    .row { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
    #container { grid-template-columns: repeat(2, 1fr); }
    .carousel-track .zone-item { flex-basis: calc((100vw - 40px - var(--gap)) / 2); }
    .brand em { display: none; }
}

@media (prefers-reduced-motion: reduce) {
    .carousel-track, .boot-bar i, .skel i, .zone-item { animation: none !important; }
}
    </style>
</head>
<body>
    <div id="boot">
        <div class="boot-mark">loading</div>
        <div class="boot-title">HOHO GAMES<span>+ GN-MATH</span></div>
        <div class="boot-bar"><i></i></div>
    </div>

    <header>
        <div class="header-inner">
            <a class="brand" href="./" onclick="closeZone(); return false;">
                <b>HOHO GAMES</b>

    <main>
        <div class="section-head">

            <p>Hover to pause · 8-up reel</p>
        </div>
        <div class="carousel-shell" id="carouselShell">
            <div class="carousel-track" id="featuredZones"></div>
        </div>

        <div class="section-head">
            <h2>All games</h2>
            <p id="zoneCount">Loading library…</p>
        </div>
        <div id="container"></div>
    </main>

    <div id="zoneViewer">
        <div class="zone-header">
            <div>
                <h2 id="zoneName">zone</h2>
                <span id="zoneId" style="display:none"></span>
                <a id="zoneAuthor" href="#" target="_blank">by Author</a>
            </div>

            <input type="file" id="importData" style="display:none" onchange="loadData(event)">
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
    <script>
const container = document.getElementById("container");
const zoneViewer = document.getElementById("zoneViewer");
let zoneFrame = document.getElementById("zoneFrame");
const searchBar = document.getElementById("searchBar");
const sortOptions = document.getElementById("sortOptions");
const featuredContainer = document.getElementById("featuredZones");

const zonesurls = [
    "https://cdn.jsdelivr.net/gh/lostgemsy/Holost@main/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/Holost@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/Holost/@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/lostgemsy/Holost/@main/zones.json"
];
let zonesURL = zonesurls[0];
const coverURLS = [
    "https://cdn.jsdelivr.net/gh/lostgemsy/Holost@main/covers",
    "https://cdn.jsdelivr.net/gh/lostgemsy/Holost/covers@main"
];
const htmlURLS = [
    "https://cdn.jsdelivr.net/gh/lostgemsy/Holost@main/htmlassets",
    "https://cdn.jsdelivr.net/gh/lostgemsy/Holost/htmlassets@main"
];
let coverURL = coverURLS[0];
let htmlURL = htmlURLS[0];
let zones = [];
let popularityData = {};
let imageObserver = null;

const SETTINGS_KEY = "hoho-settings";
const defaultSettings = {
    theme: "dark",
    panicKey: "!",
    panicUrl: "https://classroom.google.com",
    panicOn: true,
    tabName: "",
    tabIcon: "",
    nick: "player" + Math.floor(100 + Math.random() * 900),
    firebase: ""
};

function loadSettings() {
    try { return { ...defaultSettings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; }
    catch { return { ...defaultSettings }; }
}
function saveSettings(partial) {
    const next = { ...loadSettings(), ...partial };
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(next));
    applySettings(next);
    return next;
}
function applySettings(s) {
    document.body.classList.toggle("light", s.theme === "light");
    if (s.tabName) document.title = s.tabName;
    else document.title = "HOHO GAMES + GN-MATH";
    const link = document.querySelector("link[rel~='icon']");
    if (link) link.href = (s.tabIcon || "").trim() || link.href;
}

applySettings(loadSettings());

function hideBoot() {
    document.getElementById("boot").classList.add("hide");
}

function showSkeletons(n = 16) {
    container.innerHTML = "";
    for (let i = 0; i < n; i++) {
        const el = document.createElement("div");
        el.className = "skel";
        el.style.animationDelay = (i % 8) * 0.04 + "s";
        el.innerHTML = "<i></i><b></b>";
        container.appendChild(el);
    }
}

async function fetchFirst(urls) {
    for (const url of urls) {
        try {
            const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
            if (res.ok) return { res, url };
        } catch (e) {}
    }
    throw new Error("Could not reach game library");
}

async function listZones() {
    showSkeletons(16);
    try {
        try {
            const r = await fetch("https://api.github.com/repos/lostgemsy/Holost/commits?per_page=1&t=" + Date.now());
            if (r.ok) {
                const j = await r.json();
                if (j[0] && j[0].sha) zonesURL = `https://cdn.jsdelivr.net/gh/lostgemsy/Holost@${j[0].sha}/zones.json`;
            }
        } catch (e) {}

        let json;
        try {
            const got = await fetchFirst([zonesURL, ...zonesurls]);
            json = await got.res.json();
            if (got.url.includes("gn-math")) {
                coverURL = coverURLS[1];
                htmlURL = htmlURLS[1];
            }
        } catch (e) {
            const got = await fetchFirst(zonesurls);
            json = await got.res.json();
            if (got.url.includes("gn-math")) {
                coverURL = coverURLS[1];
                htmlURL = htmlURLS[1];
            }
        }

        zones = Array.isArray(json) ? json : [];
        if (zones[0]) zones[0].featured = true;
        displayZones(sortedCopy());
        displayFeaturedZones(pickRecommended(zones));
        hideBoot();
        fetchPopularity().then(() => {
            if (sortOptions.value === "popular") sortZones();
        });

        const search = new URLSearchParams(location.search);
        const id = search.get("id");
        if (id) {
            const zone = zones.find(z => z.id + "" === id + "");
            if (zone) openZone(zone);
        }
    } catch (error) {
        container.innerHTML = `<p style="grid-column:1/-1;color:var(--muted)">Error loading zones: ${error.message}</p>`;
        hideBoot();
    }
}

async function fetchPopularity() {
    try {
        const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/lostgemsy/Holost@main/files?period=year");
        const data = await response.json();
        (data || []).forEach(file => {
            const idMatch = (file.name || "").match(/\/(\d+)\.html$/);
            if (idMatch) popularityData[parseInt(idMatch[1], 10)] = file.hits.total;
        });
    } catch (e) {
        try {
            const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/lostgemsy/Holost@main/files?period=year");
            const data = await response.json();
            (data || []).forEach(file => {
                const idMatch = (file.name || "").match(/\/(\d+)\.html$/);
                if (idMatch) popularityData[parseInt(idMatch[1], 10)] = file.hits.total;
            });
        } catch (err) {
            popularityData[0] = 0;
        }
    }
}

function sortedCopy(list = zones) {
    const sortBy = sortOptions.value;
    const arr = list.slice();
    if (sortBy === "name") arr.sort((a, b) => a.name.localeCompare(b.name));
    else if (sortBy === "id") arr.sort((a, b) => a.id - b.id);
    else if (sortBy === "popular") arr.sort((a, b) => (popularityData[b.id] || 0) - (popularityData[a.id] || 0));
    else arr.sort((a, b) => b.id - a.id);
    arr.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
    return arr;
}

function sortZones() {
    displayZones(sortedCopy());
}

function pickRecommended(list) {
    const featured = list.filter(z => z.featured);
    if (featured.length >= 8) return featured.slice(0, 16);
    const rest = list.filter(z => !z.featured).slice().sort((a, b) => b.id - a.id);
    return [...featured, ...rest].slice(0, 16);
}

function coverSrc(file) {
    return (file.cover || "").replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
}

function makeCard(file, delay) {
    const zoneItem = document.createElement("div");
    zoneItem.className = "zone-item";
    zoneItem.style.animationDelay = (delay || 0) + "s";
    zoneItem.onclick = () => openZone(file);
    const img = document.createElement("img");
    img.alt = file.name;
    img.loading = "lazy";
    img.decoding = "async";
    img.dataset.src = coverSrc(file);
    img.className = "lazy-zone-img";
    img.onerror = function () {
        if (!this.dataset.fallback) {
            this.dataset.fallback = "1";
            this.src = (file.cover || "").replace("{COVER_URL}", coverURLS[1]).replace("{HTML_URL}", htmlURLS[1]);
        }
    };
    zoneItem.appendChild(img);
    const button = document.createElement("button");
    button.textContent = file.name;
    button.onclick = (event) => { event.stopPropagation(); openZone(file); };
    zoneItem.appendChild(button);
    return zoneItem;
}

function observeImages(root) {
    const lazyImages = (root || document).querySelectorAll("img.lazy-zone-img");
    if (imageObserver) {
        lazyImages.forEach(img => imageObserver.observe(img));
        return;
    }
    imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                observer.unobserve(img);
            }
        });
    }, { rootMargin: "180px", threshold: 0.05 });
    lazyImages.forEach(img => imageObserver.observe(img));
}

function displayFeaturedZones(featuredZones) {
    featuredContainer.innerHTML = "";
    const loop = featuredZones.concat(featuredZones);
    loop.forEach((file, i) => featuredContainer.appendChild(makeCard(file, (i % 8) * 0.03)));
    featuredContainer.style.animationDuration = Math.max(14, featuredZones.length * 1.6) + "s";
    observeImages(featuredContainer);
}

function displayZones(list) {
    container.innerHTML = "";
    list.forEach((file, i) => container.appendChild(makeCard(file, Math.min(i, 16) * 0.03)));
    if (!list.length) container.innerHTML = "<p style='grid-column:1/-1;color:var(--muted)'>No games found.</p>";
    document.getElementById("zoneCount").textContent = list.length + " games";
    observeImages(container);
}

function filterZones() {
    const query = searchBar.value.toLowerCase().trim();
    const filtered = zones.filter(z => (z.name || "").toLowerCase().includes(query));
    displayZones(sortedCopy(filtered));
}

function resolveZoneUrl(file) {
    return (file.url || "").replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
}

function openZone(file) {
    if ((file.url || "").startsWith("http")) {
        window.open(file.url, "_blank");
        return;
    }
    const url = resolveZoneUrl(file);
    fetch(url + "?t=" + Date.now()).then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
    }).then(html => {
        if (!zoneFrame || !zoneFrame.contentDocument) {
            zoneFrame = document.createElement("iframe");
            zoneFrame.id = "zoneFrame";
            zoneViewer.appendChild(zoneFrame);
        }
        zoneFrame.contentDocument.open();
        zoneFrame.contentDocument.write(html);
        zoneFrame.contentDocument.close();
        document.getElementById("zoneName").textContent = file.name;
        document.getElementById("zoneId").textContent = file.id;
        document.getElementById("zoneAuthor").textContent = "by " + (file.author || "lostgemsy");
        document.getElementById("zoneAuthor").href = file.authorLink || "#";
        zoneViewer.style.display = "flex";
        const next = new URL(location.href);
        next.searchParams.set("id", file.id);
        history.pushState(null, "", next.toString());
    }).catch(error => alert("Failed to load zone: " + error));
}

function aboutBlank() {
    const id = document.getElementById("zoneId").textContent;
    const zone = zones.find(z => z.id + "" === id + "");
    if (!zone) return;
    const newWindow = window.open("about:blank", "_blank");
    fetch(resolveZoneUrl(zone) + "?t=" + Date.now()).then(r => r.text()).then(html => {
        if (newWindow) {
            newWindow.document.open();
            newWindow.document.write(html);
            newWindow.document.close();
        }
    });
}

function closeZone() {
    zoneViewer.style.display = "none";
    if (zoneFrame && zoneFrame.parentNode) zoneViewer.removeChild(zoneFrame);
    zoneFrame = document.createElement("iframe");
    zoneFrame.id = "zoneFrame";
    zoneViewer.appendChild(zoneFrame);
    const url = new URL(location.href);
    url.searchParams.delete("id");
    history.pushState(null, "", url.toString());
}

function downloadZone() {
    const id = document.getElementById("zoneId").textContent;
    const zone = zones.find(z => z.id + "" === id + "");
    if (!zone) return;
    fetch(resolveZoneUrl(zone) + "?t=" + Date.now()).then(res => res.text()).then(text => {
        const blob = new Blob([text], { type: "text/html;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = zone.name + ".html";
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
    });
}

function fullscreenZone() {
    const el = zoneFrame;

    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
}

function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
    if (typeof obj === "string") return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + "...[truncated]" : obj;
    if (obj instanceof Uint8Array) return obj.length > maxArrayLen ? `[Uint8Array too large (${obj.length} bytes)]` : obj;
    if (Array.isArray(obj)) return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
    if (obj && typeof obj === "object") {
        const newObj = {};
        for (const key in obj) if (Object.prototype.hasOwnProperty.call(obj, key)) newObj[key] = sanitizeData(obj[key], maxStringLen, maxArrayLen);
        return newObj;
    }
    return obj;
}

async function saveData() {
    alert("This might take a while, don't touch anything other than this OK button");
    const result = { cookies: document.cookie, localStorage: { ...localStorage }, sessionStorage: { ...sessionStorage }, indexedDB: {}, caches: {} };
    const dbs = await indexedDB.databases();
    for (const dbInfo of dbs) {
        if (!dbInfo.name) continue;
        result.indexedDB[dbInfo.name] = {};
        await new Promise((resolve, reject) => {
            const openRequest = indexedDB.open(dbInfo.name, dbInfo.version);
            openRequest.onerror = () => reject(openRequest.error);
            openRequest.onsuccess = () => {
                const db = openRequest.result;
                const storeNames = Array.from(db.objectStoreNames);
                if (!storeNames.length) return resolve();
                const transaction = db.transaction(storeNames, "readonly");
                const storePromises = [];
                for (const storeName of storeNames) {
                    result.indexedDB[dbInfo.name][storeName] = [];
                    const store = transaction.objectStore(storeName);
                    const getAllRequest = store.getAll();
                    storePromises.push(new Promise((res, rej) => {
                        getAllRequest.onsuccess = () => {
                            result.indexedDB[dbInfo.name][storeName] = sanitizeData(getAllRequest.result, 1000, 100);
                            res();
                        };
                        getAllRequest.onerror = () => rej(getAllRequest.error);
                    }));
                }
                Promise.all(storePromises).then(resolve);
            };
        });
    }
    const cacheNames = await caches.keys();
    for (const cacheName of cacheNames) {
        const cache = await caches.open(cacheName);
        const requests = await cache.keys();
        result.caches[cacheName] = [];
        for (const req of requests) {
            const response = await cache.match(req);
            if (!response) continue;
            const cloned = response.clone();
            const contentType = cloned.headers.get("content-type") || "";
            let body;
            try {
                if (contentType.includes("application/json")) body = await cloned.json();
                else if (contentType.includes("text") || contentType.includes("javascript")) body = await cloned.text();
                else {
                    const buffer = await cloned.arrayBuffer();
                    body = btoa(String.fromCharCode(...new Uint8Array(buffer)));
                }
            } catch { body = "[Unable to read body]"; }
            result.caches[cacheName].push({ url: req.url, body, contentType });
        }
    }
    alert("Done, wait for the download");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(result)], { type: "application/octet-stream" }));
    link.download = Date.now() + ".data";
    document.body.appendChild(link);
    link.click();
    link.remove();
}

async function loadData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function (e) {
        const data = JSON.parse(e.target.result);
        if (data.cookies) data.cookies.split(";").forEach(c => { document.cookie = c.trim(); });
        if (data.localStorage) for (const key in data.localStorage) localStorage.setItem(key, data.localStorage[key]);
        if (data.sessionStorage) for (const key in data.sessionStorage) sessionStorage.setItem(key, data.sessionStorage[key]);
        alert("Data loaded");
    };
    alert("This might take a while, don't touch anything other than this OK button");
    reader.readAsText(file);
}

/* ===== CHAT ===== */
let chatDb = null;
let chatChannel = null;

function toggleChat() {
    document.getElementById("chatPanel").classList.toggle("open");
}

function pushMsg(nick, text, mine) {
    const log = document.getElementById("chatLog");
    const el = document.createElement("div");
    el.className = "msg";
    if (mine) el.style.border = "1px solid var(--line-2)";
    el.innerHTML = `<b>${escapeHtml(nick)}</b>${escapeHtml(text)}`;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
}

function initChat(reset) {
    const s = loadSettings();
    const status = document.getElementById("chatStatus");
    document.getElementById("chatLog").innerHTML = "";
    chatDb = null;
    if (s.firebase) {
        try {
            const cfg = JSON.parse(s.firebase);
            if (reset && firebase.apps.length) location.reload();
            if (!firebase.apps.length) firebase.initializeApp(cfg);
            chatDb = firebase.database();
            chatDb.ref("lobby").limitToLast(40).on("child_added", snap => {
                const v = snap.val() || {};
                if (v.n && v.t) pushMsg(v.n, v.t, false);
            });
            status.textContent = "firebase";
            return;
        } catch (err) {
            status.textContent = "firebase error · local";
        }
    }
    status.textContent = "local";
    const stored = JSON.parse(localStorage.getItem("hoho-chat") || "[]");
    stored.slice(-40).forEach(m => pushMsg(m.n, m.t, false));
    chatChannel = new BroadcastChannel("hoho-chat");
    chatChannel.onmessage = (ev) => { if (ev.data) pushMsg(ev.data.n, ev.data.t, false); };
}

function sendChat(e) {
    e.preventDefault();
    const input = document.getElementById("chatInput");
    const text = (input.value || "").trim();
    if (!text) return;
    const s = loadSettings();
    const msg = { n: s.nick || "player", t: text, at: Date.now() };
    input.value = "";
    if (chatDb) {
        chatDb.ref("lobby").push(msg);
        return;
    }
    pushMsg(msg.n, msg.t, true);
    const stored = JSON.parse(localStorage.getItem("hoho-chat") || "[]");
    stored.push(msg);
    localStorage.setItem("hoho-chat", JSON.stringify(stored.slice(-80)));
    if (chatChannel) chatChannel.postMessage(msg);
}

const schoolList = ["deledao", "goguardian", "lightspeed", "linewize", "securly", ".edu/"];
function isBlockedDomain(url) {
    try { return schoolList.some(school => (new URL(url, location.origin).hostname + "/").includes(school)); }
    catch { return false; }
}
const originalFetch = window.fetch;
window.fetch = function (url, options) {
    if (typeof url === "string" && isBlockedDomain(url)) return Promise.reject(new Error("blocked"));
    return originalFetch.apply(this, arguments);
};
