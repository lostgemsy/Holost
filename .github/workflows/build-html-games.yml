name: Build CDN game HTML and covers
# Regenerate all game wrappers and PNG covers from the current catalog.

on:
  push:
    branches: [main]
    paths-ignore:
      - "GamesHtml/**"
      - "covers/**"
      - "html/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Build GamesHtml
        run: node tools/build-html-games.mjs

      - name: Build covers
        shell: bash
        run: |
          rm -rf covers
          mkdir -p covers
          python - <<'PY'
          import json, os, re, subprocess, urllib.parse
          from PIL import Image
          text=open("zone.js",encoding="utf-8").read()
          m=re.search(r"window\.HOLOST_GAMES\s*=\s*(\[[\s\S]*?\]);\s*window\.HOLOST_ZONES",text)
          games=json.loads(m.group(1))
          for game in games:
              src=game.get("image")
              if not src: continue
              safe=re.sub(r"[^a-zA-Z0-9._-]+","_",game["path"])
              raw="https://raw.githubusercontent.com/lostgemsy/Holost/main/"+"/".join(urllib.parse.quote(x) for x in src.split("/"))
              tmp="/tmp/"+safe
              out="covers/"+safe+".png"
              try:
                  subprocess.run(["curl","-fsSL",raw,"-o",tmp],check=True)
                  im=Image.open(tmp).convert("RGBA")
                  im.thumbnail((512,512),Image.Resampling.LANCZOS)
                  im.save(out,"PNG")
              except Exception:
                  pass
              finally:
                  try: os.remove(tmp)
                  except: pass
          open("covers/README.md","w").write("Generated game covers.\n")
          PY

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GamesHtml covers
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate GamesHtml and game covers"
          git push
